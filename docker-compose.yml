version: '3.8'

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: studio-ia-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    build: .
    container_name: studio-ia-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - NEXT_PUBLIC_POCKETBASE_URL=http://pocketbase:8090
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro

volumes:
  pb_data:
